name: Update prices

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 16:40 KST, after the Korean close
    - cron: "30 21 * * 1-5"  # 06:30 KST next day, after the US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_prices.py
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Update prices $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
